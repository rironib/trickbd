name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "build-tools;29.0.3"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Android APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK to Clean Release Name
        id: prepare_asset
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          [ "$TAG_NAME" = "$GITHUB_REF" ] && TAG_NAME="v1.0.2"
          OUTPUT_APK="app/build/outputs/apk/release/TrickBD-${TAG_NAME}.apk"

          # Move the signed APK to the clean name
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_ENV
          echo "Ready to publish: $OUTPUT_APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
